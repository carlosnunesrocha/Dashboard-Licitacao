name: Build e publica imagens (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servico }}
          push: true
          tags: |
            ghcr.io/carlosnunesrocha/dashboard-licitacao-${{ matrix.servico }}:latest
            ghcr.io/carlosnunesrocha/dashboard-licitacao-${{ matrix.servico }}:${{ github.sha }}
