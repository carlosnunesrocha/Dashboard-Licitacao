# Painel de Licitações — stack para Portainer (Docker Swarm + Traefik).
#
# Portainer > Stacks > Add stack > Web editor (cole este arquivo) e cadastre as
# variáveis abaixo em "Environment variables". Os segredos NÃO ficam no arquivo.
#
#   POSTGRES_PASSWORD     senha do Postgres (use só letras e números: vai dentro de uma URL)
#   REDIS_PASSWORD        senha do Redis (idem)
#   JWT_SECRET            node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#   JWT_REFRESH_SECRET    idem, com valor DIFERENTE do anterior
#   SEED_ADMIN_EMAIL      e-mail do primeiro administrador
#   SEED_ADMIN_SENHA      senha do primeiro administrador (o seed ignora se ele já existe)
#   CAIXA_ESCOLAR_USER / CAIXA_ESCOLAR_PASS
#   LICITAR_DIGITAL_TOKEN
#   DOMINIO               opcional (padrão: licitacoes.lucriapp.com.br)
#   IMAGE_TAG             opcional (padrão: latest)
#   BNC_COMPRAS_COOKIE    opcional
#
# Antes do primeiro deploy, no manager:
#   docker volume create licitacoes_pgdata
# E em Portainer > Registries, cadastre ghcr.io (usuário do GitHub + token com
# read:packages): as imagens são privadas.

version: "3.7"

services:

  frontend:
    image: ghcr.io/carlosnunesrocha/dashboard-licitacao-frontend:${IMAGE_TAG:-latest}

    networks:
      - LucriNet

    environment:
      - TZ=America/Sao_Paulo

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.licitacoes_web.rule=Host(`${DOMINIO:-licitacoes.lucriapp.com.br}`)
        - traefik.http.routers.licitacoes_web.entrypoints=websecure
        - traefik.http.routers.licitacoes_web.tls=true
        - traefik.http.routers.licitacoes_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.licitacoes_web.priority=1
        - traefik.http.routers.licitacoes_web.service=licitacoes_web
        - traefik.http.services.licitacoes_web.loadbalancer.server.port=80
        - traefik.http.services.licitacoes_web.loadbalancer.passHostHeader=true
        - traefik.http.middlewares.licitacoes-sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.licitacoes_web.middlewares=licitacoes-sslheader

  backend:
    image: ghcr.io/carlosnunesrocha/dashboard-licitacao-backend:${IMAGE_TAG:-latest}

    networks:
      - LucriNet

    environment:
      - TZ=America/Sao_Paulo
      - PORT=3001
      - CORS_ORIGIN=https://${DOMINIO:-licitacoes.lucriapp.com.br}
      - DATABASE_URL=postgresql://licitacoes:${POSTGRES_PASSWORD}@licitacoes_postgres:5432/licitacoes
      - REDIS_URL=redis://:${REDIS_PASSWORD}@licitacoes_redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN_SECONDS=900
      - JWT_REFRESH_EXPIRES_IN_SECONDS=604800
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_SENHA=${SEED_ADMIN_SENHA}
      - SEED_ADMIN_NOME=Administrador
      - CAIXA_ESCOLAR_USER=${CAIXA_ESCOLAR_USER}
      - CAIXA_ESCOLAR_PASS=${CAIXA_ESCOLAR_PASS}
      - LICITAR_DIGITAL_TOKEN=${LICITAR_DIGITAL_TOKEN}
      - LICITAR_DIGITAL_FILTRO=favorite
      - BNC_COMPRAS_COOKIE=${BNC_COMPRAS_COOKIE:-}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      # O Swarm não tem depends_on: se o Postgres ainda não subiu, o backend cai e é reiniciado.
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.licitacoes_api.rule=Host(`${DOMINIO:-licitacoes.lucriapp.com.br}`) && PathPrefix(`/api`)
        - traefik.http.routers.licitacoes_api.entrypoints=websecure
        - traefik.http.routers.licitacoes_api.tls=true
        - traefik.http.routers.licitacoes_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.licitacoes_api.priority=2
        - traefik.http.routers.licitacoes_api.service=licitacoes_api
        - traefik.http.services.licitacoes_api.loadbalancer.server.port=3001
        - traefik.http.services.licitacoes_api.loadbalancer.passHostHeader=true
        - traefik.http.routers.licitacoes_api.middlewares=licitacoes-sslheader

  # Banco principal: licitações, Kanban, usuários, histórico.
  licitacoes_postgres:
    image: postgres:16-alpine

    volumes:
      - licitacoes_pgdata:/var/lib/postgresql/data

    networks:
      - LucriNet

    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_USER=licitacoes
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=licitacoes

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  # Banco provisório das oportunidades: sem persistência em disco, de propósito.
  # O TTL de 24h é aplicado pelo backend e o job das 2h limpa o que sobrar.
  licitacoes_redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    networks:
      - LucriNet

    environment:
      - TZ=America/Sao_Paulo

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  licitacoes_pgdata:
    external: true
    name: licitacoes_pgdata

networks:
  LucriNet:
    external: true
    name: LucriNet
